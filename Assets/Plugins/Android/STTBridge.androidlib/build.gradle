plugins {
    id 'com.android.library'
}

android {
    namespace 'com.mehmet.sttbridge'
    compileSdk 35

    defaultConfig {
        minSdk 24
        targetSdk 35
        consumerProguardFiles 'consumer-rules.pro'
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation 'com.alphacephei:vosk-android:0.3.75'
}
