buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url "https://chaquo.com/maven" }
    }
    dependencies {
        classpath "com.chaquo.python:gradle:17.0.0"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'com.chaquo.python'

android {
    namespace 'com.mehmet.sttbridge'
    compileSdk 35

    defaultConfig {
        minSdk 24
        targetSdk 35
        consumerProguardFiles 'consumer-rules.pro'

        ndk {
            // Whisper/STT + Chaquopy Python runtime için gerçek cihaz hedefi.
            abiFilters 'arm64-v8a'
        }
    }
}

chaquopy {
    defaultConfig {
        version = "3.10"

        def windowsPython310 = file("C:/Users/3mehm/AppData/Local/Programs/Python/Python310/python.exe")
        if (windowsPython310.exists()) {
            buildPython windowsPython310.absolutePath
        }

        pip {
            // spaCy import ederken runtime'da click istiyor.
            // pydantic'i şimdilik elle pinlemiyoruz; gerekirse bir sonraki hataya göre ekleyeceğiz.
            install "click==8.1.8"
            install "spacy==3.8.7"
        }
    }
}

rootProject.subprojects {
    configurations.configureEach {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
}

dependencies {
    implementation 'com.alphacephei:vosk-android:0.3.75'
    implementation 'androidx.core:core:1.12.0'
}